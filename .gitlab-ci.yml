image: eclipse-temurin:21-jdk

variables:
  ANDROID_HOME: "/opt/android-sdk"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - apt-get update && apt-get install -y wget unzip
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
  - mkdir -p $ANDROID_HOME/cmdline-tools
  - unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
  - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
  - yes | sdkmanager --licenses || true
  - sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;android-36"

stages:
  - test
  - build
  - release

unit_tests:
  stage: test
  script:
    - ./gradlew test

build_apk:
  stage: build
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

build_release_apk:
  stage: build
  script:
    - ./gradlew assembleRelease
    # Decode the keystore from base64 string variable
    - echo "$ANDROID_KEYSTORE_FILE" | base64 -d > release.keystore
    # Sign the APK
    - $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass pass:"$ANDROID_KEY_PASSWORD" --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
    - rm -f release.keystore
    - apt-get update && apt-get install -y curl
    - curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file app/build/outputs/apk/release/app-release.apk "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${CI_COMMIT_TAG}/app-release.apk"
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_TAG

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automatic release created from tag $CI_COMMIT_TAG.'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'app-release.apk'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${CI_COMMIT_TAG}/app-release.apk'



